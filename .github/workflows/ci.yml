name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # The self-check renders the client component tree outside a browser, so it
      # needs React. It never runs the bundle's real imports.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle self-check (mock client context)
        run: npm test
